<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Генератор документов — ПравоФин</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="container header-inner">
            <a href="index.html" class="logo">⚖️ <span>ПравоФин</span></a>
            <nav class="nav">
                <a href="index.html">Главная</a>
                <a href="generator.html" class="active">Генератор</a>
                <a href="analyze.html">Анализ</a>
                <a href="tax.html">Налоги</a>
                <a href="habit.html">Копилка</a>
                <a href="games.html">Игры</a>
                <a href="register.html">Регистрация</a>
                <a href="login.html">Вход</a>
                <a href="cabinet.html">Кабинет</a>
                <a href="b2b.html" class="btn-outline">Для бизнеса</a>
                <a href="chat.html" class="btn-outline">AI-чат</a>
            </nav>
            <button class="theme-toggle" id="themeToggle"><span class="theme-icon">🌙</span></button>
        </div>
    </header>

    <section style="padding:40px 0;">
        <div class="container">
            <h1 style="text-align:center;">Генератор документов</h1>
            <p style="text-align:center;color:#4A4A5A;">Заполните поля — получите готовый документ</p>
            <div class="form-container">
                <form id="docForm">
                    <div class="form-group">
                        <label>Тип документа</label>
                        <select id="docType">
                            <option value="Договор купли-продажи">Договор купли-продажи</option>
                            <option value="Исковое заявление">Исковое заявление</option>
                            <option value="Претензия">Претензия</option>
                            <option value="Договор подряда">Договор подряда</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Сторона 1</label>
                        <input type="text" id="party1" placeholder="ООО Ромашка">
                    </div>
                    <div class="form-group">
                        <label>Сторона 2</label>
                        <input type="text" id="party2" placeholder="ИП Иванов">
                    </div>
                    <div class="form-group">
                        <label>Сумма (₽)</label>
                        <input type="number" id="amount" placeholder="100000">
                    </div>
                    <div class="form-group">
                        <label>Срок (дней)</label>
                        <input type="number" id="term" placeholder="30">
                    </div>
                    <button type="submit" class="btn-primary" style="width:100%;">Сгенерировать</button>
                </form>
                <div id="result" style="margin-top:20px;display:none;">
                    <hr style="margin:20px 0;">
                    <h3>Ваш документ</h3>
                    <div id="docContent" style="background:#f5f7f5;padding:15px;border-radius:10px;white-space:pre-wrap;font-size:14px;max-height:400px;overflow:auto;"></div>
                    <button onclick="copyDoc()" class="btn-secondary" style="margin-top:10px;">Копировать</button>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer" style="margin-top:40px;border-top:1px solid #EEF0EE;padding:20px 0;text-align:center;color:#777;">
        <div class="container">
            <p>© 2026 ПравоФин. Все права защищены.</p>
        </div>
    </footer>

    <script>
        const BACKEND_URL = "https://pravofin-backend-1.onrender.com";

        document.getElementById('docForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const data = {
                docType: document.getElementById('docType').value,
                party1: document.getElementById('party1').value,
                party2: document.getElementById('party2').value,
                amount: document.getElementById('amount').value,
                term: document.getElementById('term').value
            };

            const resultDiv = document.getElementById('result');
            const contentDiv = document.getElementById('docContent');
            resultDiv.style.display = 'block';
            contentDiv.textContent = '⏳ Генерация...';

            fetch(BACKEND_URL + '/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(res => res.json())
            .then(data => {
                contentDiv.textContent = data.document || 'Ошибка генерации';
            })
            .catch(() => {
                contentDiv.textContent = '❌ Ошибка соединения с сервером';
            });
        });

        function copyDoc() {
            const text = document.getElementById('docContent').textContent;
            navigator.clipboard.writeText(text).then(() => {
                alert('Скопировано!');
            });
        }
    </script>
</body>
</html>
